{% extends "base.html" %}
{% block title %}Vendor - Product Management System{% endblock %}
{% block extra_css %}
{% set sidebar_class = "" %}
{% endblock %}
{% block page_title %}Remove Vendor{% endblock %}
{% block content %}

<form method="POST" action="/vendors/delete">
    <div class="card">
      <div class="card-header">
        <h5 class="mb-0">Remove Vendor</h5>
      </div>
      <div class="card-body">
        <div class="mb-3">
          <label class="form-label">Vendor Code <span class="text-danger">*</span></label>
          <input type="text" name="ven_code" class="form-control"
                 value="{{ purchase_order.pur_ord_no if purchase_order else '' }}" required>
        </div>
      </div>
      <div class="card-footer">
        <button type="submit" class="btn btn-danger">Remove Vendor</button>
      </div>
    </div>
  </form>
{%endblock%}
